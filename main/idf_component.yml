dependencies:
  idf: ">=5.3"
  # dragon-core networking + discovery (used by the ESP32-C3 headless console build).
  # Pinned to the first dragon-core release containing the ESP-NOW peer plane.
  dc_wifi:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_wifi
    version: v0.33.0
  dc_peer:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_peer
    version: v0.33.0
  dc_registry:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_registry
    version: v0.33.0
  # Web server: setup SPA, Wi-Fi provisioning, OTA. The console registers its
  # device-list routes into this server (dt_console_get_routes).
  dc_portal:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_portal
    version: v0.33.0
  dc_ui:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_ui
    version: v0.33.0
  dc_evlog:
    git: https://github.com/justinh-rahb/dragon-core.git
    path: components/dc_evlog
    version: v0.33.0
